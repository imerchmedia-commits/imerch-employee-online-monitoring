<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch Employee Online Monitoring</title>
    <!-- Google Fonts Integration -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;       /* Dark Corporate Slate Blue */
            --primary-light: #1e293b; /* Accent Deep Blue */
            --accent: #b45309;        /* Sophisticated Amber/Gold Accent */
            --bg-main: #f8fafc;       /* Ultra-clean Canvas Background */
            --card-bg: #ffffff;
            --text-dark: #334155;
            --text-muted: #64748b;
            --success: #059669;       /* Deep Luxury Green Badge */
            --danger: #dc2626;        /* Clean Crimson Muted Red Badge */
            --border-color: #f1f5f9;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .top-navbar {
            background-color: var(--primary); color: white; padding: 15px 40px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08); border-bottom: 3px solid var(--accent);
        }

        .navbar-brand { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
        .navbar-brand span { color: #fbbf24; font-style: italic; font-weight: 400; }

        .live-status-indicator {
            display: flex; align-items: center; gap: 8px; font-size: 12px;
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
            background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .pulse-dot {
            width: 8px; height: 8px; background-color: #10b981; border-radius: 50%;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .main-content { max-width: 1200px; margin: 40px auto; padding: 0 24px; }

        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 35px; }
        .kpi-card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(148, 163, 184, 0.05); border: 1px solid rgba(226, 232, 240, 0.8); transition: transform 0.25s ease; }
        .kpi-card:hover { transform: translateY(-3px); }
        .kpi-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin: 0 0 8px 0; font-weight: 600; }
        .kpi-value { font-size: 32px; font-weight: 700; color: var(--primary); margin: 0; }

        .controls-card {
            background: var(--card-bg); border-radius: 12px; padding: 20px 24px; margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(148, 163, 184, 0.04); border: 1px solid rgba(226, 232, 240, 0.8);
            display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
        }

        .input-group { flex: 1; min-width: 280px; position: relative; }
        input[type="text"], select { 
            width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; 
            font-size: 14px; font-family: inherit; color: var(--text-dark); background-color: #fafafa;
            box-sizing: border-box; transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); background-color: white; box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.08); }

        .table-container { background: var(--card-bg); box-shadow: 0 10px 30px rgba(15, 23, 42, 0.03); border-radius: 12px; overflow: hidden; border: 1px solid rgba(226, 232, 240, 0.8); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--primary); color: white; padding: 16px 24px; font-weight: 500; text-transform: uppercase; font-size: 12px; letter-spacing: 0.8px; border-bottom: 2px solid var(--accent); }
        td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); font-size: 14px; color: var(--text-dark); }
        tr:hover td { background-color: #f8fafc; }

        .badge-dept { background-color: #f1f5f9; color: #334155; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-block; border: 1px solid #e2e8f0; }
        .supervisor-name { font-weight: 600; color: var(--primary-light); font-size: 14px; }
        .counter-badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; min-width: 24px; text-align: center; }
        .count-zero { background-color: #fef2f2; color: var(--danger); border: 1px solid #fee2e2; }
        .count-active { background-color: #ecfdf5; color: var(--success); border: 1px solid #d1fae5; }
        .spinner-container { text-align: center; padding: 40px 0; color: var(--text-muted); font-weight: 500; }
    </style>
</head>
<body>

<header class="top-navbar">
    <div class="navbar-brand">iMerch <span>Corporate Dashboard</span></div>
    <div class="live-status-indicator"><div class="pulse-dot"></div>Live Realtime Sync</div>
</header>

<main class="main-content">
    <section class="analytics-grid">
        <div class="kpi-card"><h3 class="kpi-title">Active Supervisors</h3><p class="kpi-value" id="total-supervisors-kpi">-</p></div>
        <div class="kpi-card"><h3 class="kpi-title">Total Handled Candidates</h3><p class="kpi-value" id="total-applicants-kpi" style="color: var(--success);">-</p></div>
        <div class="kpi-card"><h3 class="kpi-title">Monitored Groups</h3><p class="kpi-value" id="total-departments-kpi">-</p></div>
    </section>

    <div class="controls-card">
        <div class="input-group"><input type="text" id="searchBar" placeholder="Search supervisor name..." onkeyup="filterData()"></div>
        <div class="input-group" style="max-width: 300px;">
            <select id="deptFilter" onchange="filterData()">
                <option value="">All Business Sectors</option>
                <option value="OPERATIONS">OPERATIONS</option>
                <option value="SBG 2 HEAD / SERTA">SBG 2 HEAD / SERTA</option>
                <option value="THE WOW GROUP">THE WOW GROUP</option>
                <option value="SBG HEAD 2 / URATEX">SBG HEAD 2 / URATEX</option>
                <option value="SBG HEAD 2 / CCPI">SBG HEAD 2 / CCPI</option>
                <option value="SBG HEAD 2 / DELFI">SBG HEAD 2 / DELFI</option>
                <option value="SBG 1 / NUTRI-ASIA">SBG 1 / NUTRI-ASIA</option>
                <option value="HR / ADMIN / ACCOUNTING">HR / ADMIN / ACCOUNTING</option>
                <option value="C-JOY / BUSINESS DEVELOPMENT">C-JOY / BUSINESS DEVELOPMENT</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">Corporate Department / Unit</th>
                    <th style="width: 45%;">Supervisor / Coordinator</th>
                    <th style="width: 20%; text-align: center;">Total Applicants</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="3"><div class="spinner-container">Kumokonekta sa pampublikong Google Sheet database...</div></td></tr>
            </tbody>
        </table>
    </div>
</main>
<script>
    // AUTOMATED SYSTEM ENGINE DIRECT READ VIA PUBLIC TSV EXPORT FEED
    const SPREADSHEET_ID = "1BnnnVgABrCViTLiYg2A3Qrj-lF13dIgcNvC_YX2RQm4"; 
    let rawData = [];
    const tsvUrl = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:tsv`;

    fetch(tsvUrl)
        .then(res => res.text())
        .then(tsvText => {
            let lines = tsvText.split('\n');
            let counts = {};
            let supervisorToDeptMap = {}; 
            let uniqueDepts = new Set();
            let totalApplicantsCount = 0;
            
            lines.forEach((line, index) => {
                if (index === 0) return; 
                let columns = line.split('\t');
                
                // 🎯 BINABASA ANG INDEX 34 (COLUMN AI) AT DEPARTMENT (COLUMN AH / INDEX 33)
                if (columns.length > 34) {
                    let supervisor = columns[34].replace(/^"|"$/g, '').trim().toUpperCase();
                    let dept = columns[33] ? columns[33].replace(/^"|"$/g, '').trim().toUpperCase() : "OPERATIONS";
                    
                    if (dept.includes("CCPI")) dept = "SBG HEAD 2 / CCPI";
                    else if (dept.includes("URATEX")) dept = "SBG HEAD 2 / URATEX";
                    else if (dept.includes("WOW")) dept = "THE WOW GROUP";
                    else if (dept.includes("SERTA")) dept = "SBG 2 HEAD / SERTA";
                    else if (dept.includes("DELFI")) dept = "SBG HEAD 2 / DELFI";
                    else if (dept.includes("NUTRI")) dept = "SBG 1 / NUTRI-ASIA";
                    else if (dept.includes("HR") || dept.includes("ACCOUNTING") || dept.includes("STAFF")) dept = "HR / ADMIN / ACCOUNTING";
                    else if (dept.includes("JOY")) dept = "C-JOY / BUSINESS DEVELOPMENT";
                    
                    if (supervisor !== "" && supervisor !== "SUPERVISOR / COORDINATOR" && supervisor !== "N/A" && supervisor !== "NA") {
                        counts[supervisor] = (counts[supervisor] || 0) + 1;
                        supervisorToDeptMap[supervisor] = dept;
                        uniqueDepts.add(dept);
                        totalApplicantsCount++;
                    }
                }
            });

            let finalDataset = [];
            for (let supervisor in counts) {
                finalDataset.push({
                    "department": supervisorToDeptMap[supervisor],
                    "supervisor": supervisor,
                    "count": counts[supervisor]
                });
            }

            finalDataset.sort((a, b) => b.count - a.count);
            rawData = finalDataset;
            
            document.getElementById('total-supervisors-kpi').innerText = Object.keys(counts).length;
            document.getElementById('total-applicants-kpi').innerText = totalApplicantsCount;
            document.getElementById('total-departments-kpi').innerText = uniqueDepts.size > 0 ? uniqueDepts.size : 9;

            renderTable(rawData);
        })
        .catch(() => {
            document.getElementById('table-body').innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--danger); padding: 30px; font-weight:600;">Failed to establish direct connection to Google Sheets. Please ensure your Spreadsheet is shared as "Anyone with the link".</td></tr>';
        });

    function renderTable(data) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 30px; color: var(--text-muted);">No records found.</td></tr>';
            return;
        }
        data.forEach(item => {
            const statusStyleClass = item.count > 0 ? 'count-active' : 'count-zero';
            const rowElement = `<tr>
                <td><span class="badge-dept">${item.department}</span></td>
                <td><span class="supervisor-name">${item.supervisor}</span></td>
                <td style="text-align: center;"><span class="counter-badge ${statusStyleClass}">${item.count}</span></td>
            </tr>`;
            tbody.innerHTML += rowElement;
        });
    }

    function filterData() {
        const searchTxt = document.getElementById('searchBar').value.toLowerCase();
        const deptVal = document.getElementById('deptFilter').value.toLowerCase();
        const filtered = rawData.filter(item => {
            const matchesSearch = item.supervisor.toLowerCase().includes(searchTxt);
            const matchesDept = item.department.toLowerCase().includes(deptVal) || deptVal === "";
            return matchesSearch && matchesDept;
        });
        renderTable(filtered);
    }
</script>
</body>
</html>
