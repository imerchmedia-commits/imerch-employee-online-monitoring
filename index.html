<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMerch Employee Online Monitoring</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f3f4f6; color: #1f2937; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #6b7280; margin-top: 0; margin-bottom: 25px; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        input, select { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; flex: 1; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #1e3a8a; color: white; font-weight: 600; text-transform: uppercase; font-size: 13px; }
        tr:hover { background-color: #f9fafb; }
        .badge-dept { background-color: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; display: inline-block; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .count-zero { background-color: #ef4444; color: white; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        .count-active { background-color: #10b981; color: white; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>iMerch Employee Online Monitoring</h1>
    <p class="subtitle">Live Recruitment and Application Monitoring System</p>

    <div class="controls">
        <input type="text" id="searchBar" placeholder="Search Supervisor Name..." onkeyup="filterData()">
        <select id="deptFilter" onchange="filterData()">
            <option value="">All Departments</option>
            <option value="OPERATIONS">OPERATIONS</option>
            <option value="SERTA">SBG 2 HEAD / SERTA</option>
            <option value="WOW">THE WOW GROUP</option>
            <option value="URATEX">SBG HEAD 2 / URATEX</option>
            <option value="CCPI">SBG HEAD 2 / CCPI</option>
            <option value="DELFI">SBG HEAD 2 / DELFI</option>
            <option value="NUTRI-ASIA">SBG 1 / NUTRI-ASIA</option>
            <option value="ADMIN">HR / ADMIN / ACCOUNTING</option>
            <option value="C-JOY">C-JOY / BUSINESS DEVELOPMENT</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Department / Unit</th>
                <th>Supervisor / Coordinator</th>
                <th style="text-align: center;">Total Applicants / Handled</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="3" style="text-align:center;">Loading tracking data...</td></tr>
        </tbody>
    </table>
</div>

<script>
    let rawData = [];

    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            rawData = data;
            renderTable(rawData);
        })
        .catch(() => {
            document.getElementById('table-body').innerHTML = '<tr><td colspan="3" style="text-align:center; color:red;">Failed to load data. Waiting for Google Sheets data update...</td></tr>';
        });

    function renderTable(data) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No matching records found.</td></tr>';
            return;
        }
        data.forEach(item => {
            const badgeClass = item.count > 0 ? 'count-active' : 'count-zero';
            const row = `<tr>
                <td><span class="badge-dept" title="${item.department}">${item.department}</span></td>
                <td><strong>${item.supervisor}</strong></td>
                <td style="text-align: center;"><span class="${badgeClass}">${item.count}</span></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function filterData() {
        const searchTxt = document.getElementById('searchBar').value.toLowerCase();
        const deptVal = document.getElementById('deptFilter').value.toLowerCase();

        const filtered = rawData.filter(item => {
            const matchesSearch = item.supervisor.toLowerCase().includes(searchTxt);
            const matchesDept = item.department.toLowerCase().includes(deptVal);
            return matchesSearch && matchesDept;
        });
        renderTable(filtered);
    }
</script>
</body>
</html>
